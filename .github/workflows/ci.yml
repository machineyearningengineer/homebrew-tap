name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-formula:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Register local tap
        run: brew tap machineyearningengineer/tap "$GITHUB_WORKSPACE"
      - name: Install formula
        run: brew install --build-from-source machineyearningengineer/tap/rdrop
      - name: Test formula
        run: brew test machineyearningengineer/tap/rdrop
      - name: Install and test job-harness (prebuilt)
        run: |
          brew install machineyearningengineer/tap/job-harness
          brew test machineyearningengineer/tap/job-harness
      - name: Install job-harness desktop cask
        run: |
          brew install --cask machineyearningengineer/tap/job-harness
          test -x "/Applications/Job Harness.app/Contents/MacOS/job-harness-desktop"
          "/Applications/Job Harness.app/Contents/MacOS/job-harness-desktop" --version
